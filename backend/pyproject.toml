[project]
name = "research-loop-agent"
version = "1.0.0"
description = "ResearchLoop clean foundation"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.53.0",
    "langgraph==1.2.12",
    "pymysql==1.2.3",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "pymupdf==1.28.2",
    "pymupdf4llm==1.28.2",
]

[project.optional-dependencies]
local-index = [
    "onnxruntime==1.31.0",
    "tokenizers==0.23.3",
    "numpy==2.5.4",
]

[tool.uv]
package = false
